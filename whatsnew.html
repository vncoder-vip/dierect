<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Whats New - Bình Luận, Ảnh & Video</title>
  <link rel="stylesheet" href="styles.css" />
  <style>
    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #030712, #111827 60%, #1f2937);
      color: #f8fafc;
      font-family: 'Plus Jakarta Sans', sans-serif;
      padding: 40px 20px 80px;
    }
    .page-shell {
      max-width: 1100px;
      margin: 0 auto;
      background: rgba(15, 23, 42, 0.78);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 24px;
      padding: 32px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.35);
    }
    .page-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 24px;
      flex-wrap: wrap;
    }
    .page-header h1 {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 2rem;
      margin: 0;
    }
    .page-header a {
      color: #fff;
      text-decoration: none;
      background: linear-gradient(135deg, #ec4899, #8b5cf6);
      padding: 10px 16px;
      border-radius: 999px;
      font-weight: 600;
    }
    .feed {
      display: grid;
      gap: 18px;
    }
    .feed-item {
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 18px;
      padding: 18px;
    }
    .feed-item-header {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 10px;
      color: #cbd5e1;
      font-size: 0.95rem;
    }
    .feed-item-media img, .feed-item-media video {
      max-width: 100%;
      border-radius: 14px;
      margin-top: 10px;
      display: block;
    }
    .empty-state {
      text-align: center;
      color: #94a3b8;
      padding: 40px 0;
    }
  </style>
</head>
<body>
  <div class="page-shell">
    <div class="page-header">
      <h1>Whats New</h1>
      <a href="index.html">Quay lại trang chủ</a>
    </div>
    <div id="feed" class="feed"></div>
  </div>

  <script>
    const COMMENT_MEDIA_CACHE_KEY = 'directchat-comment-media';
    const LOCAL_MEDIA_DB_NAME = 'directchat-local-media';
    const LOCAL_MEDIA_STORE_NAME = 'comments';
    const localMediaUrls = new Set();
    let localMediaDbPromise = null;

    window.addEventListener('beforeunload', () => {
      localMediaUrls.forEach((url) => URL.revokeObjectURL(url));
    });

    function escapeHtml(value) {
      const element = document.createElement('div');
      element.textContent = String(value || '');
      return element.innerHTML;
    }

    function resolveMediaUrl(value) {
      if (!value) return '';
      try {
        const parsed = new URL(String(value), window.location.origin);
        return ['http:', 'https:', 'blob:', 'data:'].includes(parsed.protocol) ? parsed.href : '';
      } catch {
        return '';
      }
    }

    function inferMediaType(url) {
      const cleanUrl = String(url || '').split(/[?#]/, 1)[0].toLowerCase();
      if (/\.(png|jpe?g|gif|webp|bmp|avif)$/i.test(cleanUrl)) return 'image';
      if (/\.(mp4|webm|ogg|mov|m4v)$/i.test(cleanUrl)) return 'video';
      return '';
    }

    function extractMediaFromText(text) {
      const urls = String(text || '').match(/https?:\/\/[^\s<>'"`]+/g) || [];
      for (const rawUrl of urls) {
        const mediaUrl = resolveMediaUrl(rawUrl.replace(/[),.!?]+$/g, ''));
        const mediaType = inferMediaType(mediaUrl);
        if (mediaType && mediaUrl) return { media_type: mediaType, media_url: mediaUrl };
      }
      return { media_type: '', media_url: '' };
    }

    function getMediaInfo(item) {
      const mediaUrl = resolveMediaUrl(item?.media_url || item?.mediaUrl || '');
      const explicitType = String(item?.media_type || item?.mediaType || '').trim().toLowerCase();
      if (!mediaUrl) return extractMediaFromText(item?.text);
      const mediaType = explicitType === 'image' || explicitType === 'video'
        ? explicitType
        : inferMediaType(mediaUrl);
      return { media_type: mediaType, media_url: mediaType && mediaUrl ? mediaUrl : '' };
    }

    function getMediaCacheKey(item) {
      const id = String(item?.id || item?._id || '').trim();
      if (id) return `id:${id}`;
      const name = String(item?.name || '').trim().toLowerCase();
      const text = String(item?.text || '').trim().toLowerCase();
      return name && text ? `content:${name}|${text}` : '';
    }

    function openLocalMediaDb() {
      if (!('indexedDB' in window)) return Promise.resolve(null);
      if (localMediaDbPromise) return localMediaDbPromise;
      localMediaDbPromise = new Promise((resolve, reject) => {
        const request = indexedDB.open(LOCAL_MEDIA_DB_NAME, 1);
        request.onupgradeneeded = () => {
          if (!request.result.objectStoreNames.contains(LOCAL_MEDIA_STORE_NAME)) {
            request.result.createObjectStore(LOCAL_MEDIA_STORE_NAME);
          }
        };
        request.onsuccess = () => resolve(request.result);
        request.onerror = () => reject(request.error);
      }).catch(() => null);
      return localMediaDbPromise;
    }

    async function mergeLocalFileMedia(item) {
      if (item.media_url) return item;
      const key = getMediaCacheKey(item);
      if (!key) return item;
      const db = await openLocalMediaDb();
      if (!db) return item;
      const file = await new Promise((resolve) => {
        const request = db.transaction(LOCAL_MEDIA_STORE_NAME, 'readonly')
          .objectStore(LOCAL_MEDIA_STORE_NAME)
          .get(key);
        request.onsuccess = () => resolve(request.result || null);
        request.onerror = () => resolve(null);
      });
      if (!file) return item;
      const mediaUrl = URL.createObjectURL(file);
      localMediaUrls.add(mediaUrl);
      const mediaType = String(file.type || '').startsWith('video/') ? 'video' : 'image';
      return { ...item, media_type: mediaType, media_url: mediaUrl };
    }

    async function mergeCachedMedia(item) {
      const media = getMediaInfo(item);
      if (media.media_url) return { ...item, ...media };
      try {
        const cache = JSON.parse(localStorage.getItem(COMMENT_MEDIA_CACHE_KEY) || '{}');
        const cached = cache && cache[getMediaCacheKey(item)];
        if (cached) return { ...item, ...getMediaInfo(cached) };
      } catch {
        // Continue with IndexedDB fallback.
      }
      return mergeLocalFileMedia({ ...item, ...media });
    }

    async function loadFeed() {
      const feed = document.getElementById('feed');
      try {
        const response = await fetch('/api/comments');
        if (!response.ok) {
          feed.innerHTML = '<div class="empty-state">Không thể tải dữ liệu.</div>';
          return;
        }
        const rawItems = await response.json();
        const items = Array.isArray(rawItems) ? await Promise.all(rawItems.map(mergeCachedMedia)) : [];
        if (!Array.isArray(items) || !items.length) {
          feed.innerHTML = '<div class="empty-state">Chưa có bình luận nào.</div>';
          return;
        }
        feed.innerHTML = items.map((item) => {
          const createdAt = item.created_at ? new Date(item.created_at).toLocaleString('vi-VN') : 'Không rõ thời gian';
          const media = getMediaInfo(item);
          const mediaUrl = escapeHtml(media.media_url);
          const mediaHtml = media.media_type === 'image' && media.media_url
            ? `<div class="feed-item-media"><img loading="lazy" src="${mediaUrl}" alt="Ảnh trong bình luận của ${escapeHtml(item.name)}" /></div>`
            : media.media_type === 'video' && media.media_url
              ? `<div class="feed-item-media"><video controls playsinline preload="metadata" src="${mediaUrl}"></video></div>`
              : '';
          return `
            <article class="feed-item">
              <div class="feed-item-header">
                <strong>${escapeHtml(item.name)}</strong>
                <span>${createdAt}</span>
              </div>
              <p>${escapeHtml(item.text)}</p>
              ${mediaHtml}
            </article>
          `;
        }).join('');
      } catch (error) {
        feed.innerHTML = '<div class="empty-state">Không thể tải dữ liệu.</div>';
      }
    }

    loadFeed();
  </script>
</body>
</html>
