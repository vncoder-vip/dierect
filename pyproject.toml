[project]
name = "chuot-chat"
version = "1.0.0"
description = "Chuột Chat Flask app"
requires-python = ">=3.11"
dependencies = [
    "flask==3.0.3",
    "requests==2.31.0",
]

[project.optional-dependencies]
postgres = ["psycopg2-binary==2.9.9"]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"